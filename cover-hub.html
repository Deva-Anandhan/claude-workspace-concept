<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#FAF9F5;background-image:radial-gradient(#D9D6C9 1.3px,transparent 1.3px);background-size:32px 32px;font-family:Inter,sans-serif;color:#141413;-webkit-font-smoothing:antialiased;position:relative}
.copy{position:absolute;left:110px;top:160px;width:760px;display:flex;flex-direction:column;gap:30px}
.kicker{font-family:Caveat,cursive;font-size:46px;font-weight:600;color:#C6613F;transform:rotate(-2deg);transform-origin:left}
h1{font-family:'Source Serif 4',Georgia,serif;font-weight:500;font-size:100px;line-height:1.04;letter-spacing:-.02em}
h1 .mark{background:linear-gradient(transparent 58%,rgba(217,119,87,.38) 58%,rgba(217,119,87,.38) 92%,transparent 92%);padding:0 6px;margin:0 -6px}
.sub{font-size:32px;line-height:1.42;color:#3D3D3A;white-space:nowrap}
.play{display:inline-flex;align-items:center;gap:20px;font-weight:600;font-size:30px;margin-top:6px}
.play i{width:78px;height:78px;border-radius:50%;background:#D97757;display:grid;place-items:center}
.play i::after{content:"";border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:7px}
.tag{position:absolute;left:110px;bottom:52px;font-size:20px;color:#73726C}
svg{position:absolute;inset:0}
.hand{font-family:Caveat,cursive}
</style>
</head>
<body>
<div class="copy">
  <span class="kicker">the future is here ↓</span>
  <h1>How one person could run <span class="mark">a whole company.</span></h1>
  <p class="sub">Ask once. AI does the work. You stay in control.</p>
  <span class="play"><i></i>Watch the 2-minute film</span>
</div>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<span class="tag">An independent concept by Deva Anandhan. Not an Anthropic product.</span>
<script>
const svg = document.getElementById('s'), rc = rough.svg(svg);
const INK = '#2A2926', ACC = '#D97757', SOFT = '#F7E6DE', GREEN = '#3F7D52', MUTE = '#73726C';
let seed = 11;
const opt = o => Object.assign({ roughness: 1.3, bowing: 1.1, stroke: INK, strokeWidth: 2.6, seed: seed++ }, o || {});
const add = n => svg.appendChild(n);
const text = (x, y, t, size, fill, weight, anchor, rot) => { const e = document.createElementNS('http://www.w3.org/2000/svg', 'text'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('class', 'hand'); e.setAttribute('font-size', size); e.setAttribute('font-weight', weight || 600); e.setAttribute('fill', fill || INK); e.setAttribute('text-anchor', anchor || 'middle'); if (rot) e.setAttribute('transform', `rotate(${rot} ${x} ${y})`); e.textContent = t; add(e); return e; };
const head = (x2, y2, from, o) => { const a = Math.atan2(y2 - from[1], x2 - from[0]), L = 22; add(rc.linearPath([[x2 - L * Math.cos(a - .45), y2 - L * Math.sin(a - .45)], [x2, y2], [x2 - L * Math.cos(a + .45), y2 - L * Math.sin(a + .45)]], opt(o))); };

const CX = 1450, CY = 545, R = 300;
// the workspace boundary
add(rc.ellipse(CX, CY, 2 * R + 220, 2 * R + 200, opt({ stroke: ACC, strokeWidth: 3.4, fill: 'rgba(247,230,222,.55)', fillStyle: 'solid', roughness: 1.1 })));
text(CX, CY - R - 128, 'the modern workspace, powered entirely through AI', 40, ACC, 700, 'middle', -2);

// ring of pieces, with a gap on the left for "you"
const parts = [['Sign-in', 'an ID per bot'], ['Chat', 'ask anything'], ['Mail', 'work comes in'], ['Browser', 'agents click'], ['Bots', 'your AI team'], ['Pay', 'inside your limits'], ['Vault', 'keys, never seen']];
parts.forEach(([name, note], i) => {
  const a = (205.7 + i * 360 / parts.length) * Math.PI / 180, x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);
  add(rc.line(CX + 150 * Math.cos(a) * 1.05, CY + 70 * Math.sin(a) * 1.35, x - 96 * Math.cos(a) * 0.9, y - 40 * Math.sin(a), opt({ stroke: '#8E8B80', strokeWidth: 2, roughness: 1.6 })));
  add(rc.rectangle(x - 98, y - 40, 196, 80, opt({ fill: '#FFFFFF', fillStyle: 'solid' })));
  text(x, y + 2, name, 40, INK, 700);
  text(x, y + 32, note, 26, MUTE, 600);
});

// centre
add(rc.rectangle(CX - 160, CY - 74, 320, 148, opt({ fill: ACC, fillStyle: 'hachure', hachureGap: 9, fillWeight: 2, stroke: ACC, strokeWidth: 3.2 })));
add(rc.rectangle(CX - 148, CY - 62, 296, 124, opt({ fill: '#FFFFFF', fillStyle: 'solid' })));
text(CX, CY - 8, 'Claude', 54, INK, 700);
text(CX, CY + 42, 'Workspace', 54, INK, 700);

// you, outside, asking once
const YX = 965, YY = 575;
add(rc.circle(YX, YY - 86, 56, opt()));
add(rc.line(YX, YY - 58, YX, YY + 18, opt()));
add(rc.line(YX, YY - 32, YX - 36, YY - 4, opt()));
add(rc.line(YX, YY - 32, YX + 42, YY - 40, opt()));
add(rc.line(YX, YY + 18, YX - 28, YY + 72, opt()));
add(rc.line(YX, YY + 18, YX + 28, YY + 72, opt()));
text(YX, YY + 116, 'you', 42);
const p0 = [YX + 60, YY - 40], p1 = [CX - 230, CY - 18], p2 = [CX - 168, CY - 6];
add(rc.curve([p0, p1, p2], opt({ stroke: INK, strokeWidth: 3.2 })));
head(p2[0], p2[1], p1, { stroke: INK, strokeWidth: 3.2 });
text(YX + 70, YY - 66, 'ask once', 38, INK, 700, 'start', -4);

// done note
text(1850, 1012, 'you approve what matters ✓', 40, GREEN, 700, 'end', -3);
</script>
</body>
</html>
